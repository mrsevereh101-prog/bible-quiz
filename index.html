<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEF5; --lead:#1D1B30; --text:#1D1B30; --muted:#5B5873; --surface:#FFFFFF;
  --lapis:#2E5AAC; --emerald:#1F8A70; --ruby:#B83B5E; --amber:#C98A10;
  --good:#1F8A70; --bad:#B83B5E; --line:rgba(29,27,48,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15142A; --lead:#07061A; --text:#F1EEFF; --muted:#A9A5C7; --surface:#201F3A;
    --lapis:#4A7BD6; --emerald:#2BAA8A; --ruby:#D5577A; --amber:#E4A92E;
    --good:#2BAA8A; --bad:#D5577A; --line:rgba(241,238,255,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#15142A; --lead:#07061A; --text:#F1EEFF; --muted:#A9A5C7; --surface:#201F3A;
  --lapis:#4A7BD6; --emerald:#2BAA8A; --ruby:#D5577A; --amber:#E4A92E;
  --good:#2BAA8A; --bad:#D5577A; --line:rgba(241,238,255,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:20px 18px 32px;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* Start */
.window{width:150px;height:190px;margin:28px auto 22px;border-radius:75px 75px 6px 6px;
  background:var(--lead);padding:7px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr;gap:7px;overflow:hidden}
.window span{display:block}
.window span:nth-child(1){background:var(--lapis);border-radius:68px 0 0 0}
.window span:nth-child(2){background:var(--ruby);border-radius:0 68px 0 0}
.window span:nth-child(3){background:var(--emerald)}
.window span:nth-child(4){background:var(--amber)}
h1{font-size:clamp(2.4rem,9vw,3.2rem);font-weight:800;line-height:1;margin:0 0 10px;text-align:center;letter-spacing:-.02em}
.lede{font-family:Newsreader,Georgia,serif;font-size:1.15rem;line-height:1.5;color:var(--muted);text-align:center;margin:0 auto 28px;max-width:34ch}
.label{font-weight:600;margin:0 0 10px;font-size:.95rem}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.lvl{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.lvl b{display:block;font-size:1.05rem}
.lvl small{color:var(--muted);font-size:.85rem}
.lvl[aria-pressed="true"]{border-color:var(--text)}
.primary{background:var(--text);color:var(--bg);border-radius:14px;padding:17px;font-weight:800;font-size:1.1rem;width:100%}
.best{text-align:center;color:var(--muted);margin-top:14px;font-size:.95rem;min-height:1.2em}

/* Game */
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;font-weight:600}
.hud .score{font-size:1.4rem;font-weight:800}
.hud .meta{color:var(--muted);font-size:.95rem}
.streak{color:var(--amber)}
.timer{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:22px}
.timer i{display:block;height:100%;width:100%;background:var(--text);transform-origin:left}
.kind{color:var(--muted);font-size:.9rem;font-weight:600;margin:0 0 8px}
.q{font-size:clamp(1.35rem,5.4vw,1.7rem);font-weight:600;line-height:1.25;margin:0 0 22px;letter-spacing:-.01em}
.q .quote{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400}

/* The leaded-glass answer panes */
.panes{display:grid;gap:8px;background:var(--lead);padding:8px;border-radius:18px}
.pane{color:#fff;text-align:left;padding:18px 16px;font-weight:600;font-size:1.05rem;line-height:1.3;border-radius:10px;
  position:relative;transition:filter .2s,opacity .2s,transform .12s;min-height:60px}
.pane::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.pane:nth-child(4n+1){background:var(--lapis)}
.pane:nth-child(4n+2){background:var(--ruby)}
.pane:nth-child(4n+3){background:var(--emerald)}
.pane:nth-child(4n+4){background:var(--amber);color:#1D1B30}
.pane:active{transform:scale(.98)}
.panes.done .pane{opacity:.28;cursor:default}
.panes.done .pane.right{opacity:1;box-shadow:0 0 0 3px #fff,0 0 22px 4px rgba(255,255,255,.45)}
.panes.done .pane.wrong{opacity:.7}
.pane .mark{float:right;font-weight:800;margin-left:8px}

.reveal{margin-top:18px;background:var(--surface);border-radius:14px;padding:16px 18px;border-left:5px solid var(--good);display:none}
.reveal.on{display:block}
.reveal.miss{border-left-color:var(--bad)}
.reveal h2{margin:0 0 6px;font-size:1.1rem}
.reveal p{margin:0;font-family:Newsreader,Georgia,serif;font-size:1.08rem;line-height:1.5}
.reveal .ref{font-family:inherit;color:var(--muted);font-size:.9rem;margin-top:8px}
.next{margin-top:16px;display:none}
.next.on{display:block}

/* Results */
.result-top{text-align:center;margin:36px 0 26px}
.big{font-size:clamp(3.5rem,16vw,5rem);font-weight:800;line-height:1;letter-spacing:-.03em}
.sub{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--lead);padding:8px;border-radius:18px;margin-bottom:22px}
.stats div{background:var(--surface);border-radius:10px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.stats small{color:var(--muted)}
.verdict{font-family:Newsreader,Georgia,serif;font-size:1.2rem;line-height:1.5;text-align:center;margin:0 auto 26px;max-width:32ch}
.ghost{background:transparent;color:var(--text);border:2px solid var(--line);border-radius:14px;padding:15px;font-weight:600;width:100%;margin-top:10px}

.lvl.wide{grid-column:1/-1}

/* Puzzles */
.puzzle{margin-bottom:14px}
.puzzle[hidden],.panes[hidden]{display:none}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:16px}
.slot{width:40px;height:48px;border-radius:9px;border:2px dashed var(--line);background:transparent;color:var(--text);
  font-weight:800;font-size:1.3rem;display:grid;place-items:center;padding:0}
.slot.filled{border-style:solid;border-color:var(--text);background:var(--surface)}
.slots.right .slot{border-color:var(--good);color:var(--good)}
.slots.wrong .slot{border-color:var(--bad);color:var(--bad)}
.slots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--lead);padding:8px;border-radius:18px}
.tile{width:44px;height:50px;border-radius:9px;color:#fff;font-weight:800;font-size:1.3rem;padding:0;position:relative}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.tile:nth-child(4n+1){background:var(--lapis)}
.tile:nth-child(4n+2){background:var(--ruby)}
.tile:nth-child(4n+3){background:var(--emerald)}
.tile:nth-child(4n+4){background:var(--amber);color:#1D1B30}
.tile:disabled{opacity:.2;cursor:default}
.tools{display:flex;justify-content:center;margin-top:10px}
.link{background:transparent;color:var(--muted);font-weight:600;text-decoration:underline;padding:8px 12px}
.link:disabled{opacity:.4;cursor:default}
.pane .badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;margin-right:10px;
  background:rgba(255,255,255,.25);font-weight:800;vertical-align:middle}
.pane .badge:empty{background:transparent;border:2px solid rgba(255,255,255,.5)}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.clues li{background:var(--surface);border-radius:12px;padding:12px 14px;font-family:Newsreader,Georgia,serif;font-size:1.1rem;line-height:1.4;
  border-left:5px solid var(--amber)}
.clues li b{font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--muted);font-size:.8rem;display:block;margin-bottom:2px}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin:8px 0 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">

  <section class="screen on" id="start" aria-labelledby="t">
    <div class="window" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1 id="t">Bible Quiz</h1>
    <p class="lede">Ten questions against the clock, with puzzles mixed in. Answer fast and keep your streak alive.</p>
    <p class="label">Choose a level</p>
    <div class="levels" role="group" aria-label="Level">
      <button class="lvl" data-l="mixed" aria-pressed="true"><b>Mixed</b><small>A bit of everything</small></button>
      <button class="lvl" data-l="easy" aria-pressed="false"><b>Easy</b><small>100 pts each</small></button>
      <button class="lvl" data-l="medium" aria-pressed="false"><b>Medium</b><small>150 pts each</small></button>
      <button class="lvl" data-l="hard" aria-pressed="false"><b>Hard</b><small>200 pts each</small></button>
      <button class="lvl wide" data-l="puzzles" aria-pressed="false"><b>Puzzles only</b><small>Unscramble, put in order, who am I, odd one out</small></button>
    </div>
    <button class="primary" id="go">Start round</button>
    <p class="best" id="bestStart"></p>
  </section>

  <section class="screen" id="game" aria-live="polite">
    <div class="hud">
      <span class="score" id="score">0</span>
      <span class="meta"><span class="streak" id="streak"></span> <span id="count">1 of 10</span></span>
    </div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <p class="kind" id="kind"></p>
    <h2 class="q" id="q"></h2>
    <div class="puzzle" id="puzzle" hidden></div>
    <div class="panes" id="panes"></div>
    <div class="reveal" id="reveal"><h2 id="rh"></h2><p id="rn"></p><p class="ref" id="rr"></p></div>
    <button class="primary next" id="next">Next question</button>
  </section>

  <section class="screen" id="end">
    <div class="result-top">
      <div class="big" id="final">0</div>
      <div class="sub" id="bestEnd"></div>
    </div>
    <div class="stats">
      <div><b id="sCorrect">0</b><small>correct</small></div>
      <div><b id="sStreak">0</b><small>best streak</small></div>
      <div><b id="sLevel">Mixed</b><small>level</small></div>
    </div>
    <p class="verdict" id="verdict"></p>
    <button class="primary" id="again">Play again</button>
    <button class="ghost" id="home">Change level</button>
  </section>

</main>
<script>
const Q=[

{d:"easy",k:"Unscramble",t:"scramble",q:"He built the ark.",a:"NOAH",n:"Noah built the ark of gopher wood.",r:"Genesis 6:14"},
{d:"easy",k:"Unscramble",t:"scramble",q:"The garden God planted for Adam.",a:"EDEN",n:"The Lord planted a garden eastward in Eden.",r:"Genesis 2:8"},
{d:"easy",k:"Unscramble",t:"scramble",q:"The shepherd boy anointed as king.",a:"DAVID",n:"Samuel anointed the youngest son of Jesse.",r:"1 Samuel 16:11–13"},
{d:"easy",k:"Unscramble",t:"scramble",q:"Jesus called him out of the tomb.",a:"LAZARUS",n:"“Lazarus, come forth.”",r:"John 11:43–44"},
{d:"easy",k:"Unscramble",t:"scramble",q:"The mother of Jesus.",a:"MARY",n:"Gabriel was sent to a virgin named Mary.",r:"Luke 1:26–27"},
{d:"medium",k:"Unscramble",t:"scramble",q:"The town where Jesus was born.",a:"BETHLEHEM",n:"Bethlehem of Judea, the city of David.",r:"Matthew 2:1"},
{d:"medium",k:"Unscramble",t:"scramble",q:"The queen who went to the king uninvited.",a:"ESTHER",n:"“If I perish, I perish.”",r:"Esther 4:16"},

{d:"hard",k:"Unscramble",t:"scramble",q:"King of Salem and priest of the most high God.",a:"MELCHIZEDEK",n:"He blessed Abram and brought out bread and wine.",r:"Genesis 14:18"},
{d:"hard",k:"Unscramble",t:"scramble",q:"The chief tax collector of Jericho.",a:"ZACCHAEUS",n:"He climbed a sycamore tree to see Jesus.",r:"Luke 19:2–4"},
{d:"hard",k:"Unscramble",t:"scramble",q:"The island where John saw the Revelation.",a:"PATMOS",n:"John was there for the word of God.",r:"Revelation 1:9"},

{d:"easy",k:"Put in order",t:"order",q:"Put the first four books of the Bible in order.",items:["Genesis","Exodus","Leviticus","Numbers"],n:"Deuteronomy completes the five books of Moses.",r:"Old Testament order"},
{d:"easy",k:"Put in order",t:"order",q:"Put the four Gospels in Bible order.",items:["Matthew","Mark","Luke","John"],n:"Acts follows John.",r:"New Testament order"},
{d:"easy",k:"Put in order",t:"order",q:"Put these in the order God made them.",items:["Light","The sky","Dry land and plants","Sun, moon and stars"],n:"Days one to four of creation.",r:"Genesis 1:3–19"},
{d:"medium",k:"Put in order",t:"order",q:"Put these events in Jesus' life in order.",items:["Born in Bethlehem","Baptized in the Jordan","Feeds the five thousand","The Last Supper"],n:"From the nativity to the night he was betrayed.",r:"Matthew 2; 3; 14; 26"},
{d:"medium",k:"Put in order",t:"order",q:"Put these kings in the order they reigned.",items:["Saul","David","Solomon","Rehoboam"],n:"The kingdom split under Rehoboam.",r:"1 Samuel 10 – 1 Kings 12"},
{d:"medium",k:"Put in order",t:"order",q:"Put Joseph's story in order.",items:["Sold by his brothers","Serves in Potiphar's house","Thrown into prison","Interprets Pharaoh's dreams"],n:"From the pit to the palace.",r:"Genesis 37–41"},
{d:"medium",k:"Put in order",t:"order",q:"Put these moments from Moses' life in order.",items:["Found in a basket","The burning bush","The plagues on Egypt","The Ten Commandments"],n:"From the Nile to Sinai.",r:"Exodus 2–20"},

{d:"hard",k:"Put in order",t:"order",q:"Put these prophets' books in Bible order.",items:["Hosea","Joel","Amos","Obadiah"],n:"The first four of the twelve minor prophets.",r:"Old Testament order"},
// PUZZLES — Odd one out
{d:"easy",k:"Odd one out",q:"Which of these is not one of the four Gospels?",a:"Acts",w:["Mark","Luke","John"],n:"Acts continues the story after the Gospels.",r:"Acts 1:1"},
{d:"easy",k:"Odd one out",q:"Which of these was not a plague on Egypt?",a:"Earthquake",w:["Frogs","Locusts","Darkness"],n:"There were ten plagues; an earthquake was not one of them.",r:"Exodus 7–12"},
{d:"medium",k:"Odd one out",q:"Which of these was not one of the twelve apostles Jesus chose?",a:"Paul",w:["Andrew","Bartholomew","Thaddaeus"],n:"Paul became an apostle later, after meeting Jesus on the Damascus road.",r:"Matthew 10:2–4"},
{d:"medium",k:"Odd one out",q:"Which of these is not a book of the Bible?",a:"Hezekiah",w:["Obadiah","Habakkuk","Zephaniah"],n:"Hezekiah was a king of Judah, but no book bears his name.",r:"2 Kings 18–20"},
{d:"medium",k:"Odd one out",q:"Which of these was not a judge of Israel?",a:"Jeremiah",w:["Gideon","Samson","Deborah"],n:"Jeremiah was a prophet in the last days of Judah.",r:"Jeremiah 1:1–3"},
{d:"medium",k:"Odd one out",q:"Which of these was not a son of Noah?",a:"Enoch",w:["Shem","Ham","Japheth"],n:"Enoch was Noah's great-grandfather.",r:"Genesis 5:21–29; 6:10"},

{d:"medium",k:"Who am I?",t:"clues",q:"Who am I?",clues:["I was a Pharisee and a ruler of the Jews.","I came to Jesus by night.","I brought spices to help bury him."],a:"Nicodemus",w:["Joseph of Arimathea","Gamaliel","Caiaphas"],n:"Jesus told him he must be born again.",r:"John 3:1–3; 19:39"},

{d:"hard",k:"Who am I?",t:"clues",q:"Who am I?",clues:["I was a judge and a prophet.","I anointed two kings.","As a boy I heard God call my name in the night."],a:"Samuel",w:["Eli","Nathan","Elisha"],n:"Samuel anointed Saul and then David.",r:"1 Samuel 3; 10; 16"},

// EASY
{d:"easy",k:"Multiple choice",q:"Who built the ark?",a:"Noah",w:["Moses","Abraham","David"],n:"God told Noah to build an ark of gopher wood before the flood.",r:"Genesis 6:14"},

function getBest(){try{return JSON.parse(localStorage.getItem("bq-best")||"{}")}catch(e){return{}}}

function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
function name(l){return l==="puzzles"?"Puzzles":l[0].toUpperCase()+l.slice(1)}
function paintBest(){const b=getBest()[level];$("bestStart").textContent=b?`Your best on ${name(level)}: ${b}`:""}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

document.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{
  level=b.dataset.l;
  document.querySelectorAll(".lvl").forEach(x=>x.setAttribute("aria-pressed",x===b));
  paintBest();
});

function start(){
  const pool=level==="mixed"?Q:level==="puzzles"?Q.filter(isPuzzle):Q.filter(q=>q.d===level);
  deck=shuffle(pool).slice(0,ROUND);
  i=0;score=0;streak=0;bestStreak=0;correct=0;
  show("game");ask();
}

function ask(){
  locked=false;clueN=1;
  const q=deck[i];lim=limitFor(q);
  $("score").textContent=score;
  $("count").textContent=`${i+1} of ${deck.length}`;
  $("streak").textContent=streak>=2?`🔥 ${streak}`:"";
  $("kind").textContent=`${q.k} · ${name(q.d)}`;
  $("q").innerHTML=q.q;
  const box=$("panes"), P=$("puzzle");
  box.className="panes";box.innerHTML="";box.hidden=false;box.style.gridTemplateColumns="1fr";
  P.innerHTML="";P.hidden=true;
  if(q.t==="scramble")renderScramble(q);
  else if(q.t==="order")renderOrder(q);
  else{if(q.t==="clues")renderClues(q);renderChoices(q)}
  $("reveal").className="reveal";$("next").className="primary next";
  t0=performance.now();cancelAnimationFrame(raf);tick();
}

function renderChoices(q){
  const opts=q.k==="True or false"?["True","False"]:shuffle([q.a,...q.w]);
  const box=$("panes");
  box.style.gridTemplateColumns=opts.length===2?"1fr 1fr":"1fr";
  opts.forEach(o=>{const b=el("button","pane",o);b.onclick=()=>answer(o,b);box.appendChild(b)});
}

function renderClues(q){
  const P=$("puzzle");P.hidden=false;
  const ol=el("ol","clues"), tools=el("div","tools"), more=el("button","link");
  tools.appendChild(more);P.append(ol,tools);
  const draw=()=>{
    ol.innerHTML="";
    q.clues.slice(0,clueN).forEach((c,k)=>{const li=el("li");li.append(el("b",null,`Clue ${k+1}`),c);ol.appendChild(li)});
    more.textContent=clueN<q.clues.length?`Another clue (−25% points)`:"No more clues";
    more.disabled=clueN>=q.clues.length;
  };
  more.onclick=()=>{if(!locked&&clueN<q.clues.length){clueN++;draw()}};
  draw();
}

function renderScramble(q){
  const P=$("puzzle"), word=q.a;P.hidden=false;$("panes").hidden=true;
  let letters=shuffle(word.split(""));
  for(let g=0;letters.join("")===word&&g<20;g++)letters=shuffle(letters);
  let picks=[];
  const slots=el("div","slots"), tiles=el("div","tiles"), tools=el("div","tools"), clear=el("button","link","Clear");
  slots.setAttribute("aria-label","Your answer");
  tools.appendChild(clear);P.append(slots,tiles,tools,el("p","hint","Tap the letters in order. Tap a filled box to take a letter back."));
  const draw=()=>{
    slots.innerHTML="";tiles.innerHTML="";
    for(let k=0;k<word.length;k++){
      const s=el("button","slot"+(picks[k]!=null?" filled":""),picks[k]!=null?letters[picks[k]]:"");
      s.setAttribute("aria-label",picks[k]!=null?`Remove ${letters[picks[k]]}`:`Empty box ${k+1}`);
      s.onclick=()=>{if(locked||picks[k]==null)return;picks.splice(k,1);draw()};
      slots.appendChild(s);
    }
    letters.forEach((L,j)=>{
      const t=el("button","tile",L);t.disabled=picks.includes(j);
      t.onclick=()=>{
        if(locked||picks.includes(j))return;picks.push(j);draw();
        if(picks.length===word.length){
          if(picks.map(x=>letters[x]).join("")===word){slots.classList.add("right");resolve(true,false)}
          else{slots.classList.remove("shake");void slots.offsetWidth;slots.classList.add("shake");
            setTimeout(()=>{if(!locked){picks=[];draw()}},450)}
        }
      };
      tiles.appendChild(t);
    });
  };
  clear.onclick=()=>{if(!locked){picks=[];draw()}};
  P._showAnswer=ok=>{
    slots.innerHTML="";word.split("").forEach(L=>slots.appendChild(el("span","slot filled",L)));
    slots.className="slots "+(ok?"right":"wrong");
  };
  draw();
}

function renderOrder(q){
  const box=$("panes"), P=$("puzzle");
  let sh=shuffle(q.items);
  for(let g=0;sh.join("|")===q.items.join("|")&&g<20;g++)sh=shuffle(sh);
  let picks=[];const btns=[];
  P.hidden=false;
  P.append(el("p","hint","Tap them from first to last. Tap a numbered one to undo it."));
  sh.forEach(it=>{
    const b=el("button","pane"), badge=el("span","badge");
    b.append(badge,it);btns.push({b,badge,it});
    b.onclick=()=>{
      if(locked)return;
      const at=picks.indexOf(it);
      if(at>=0)picks=picks.slice(0,at);else picks.push(it);
      btns.forEach(x=>{const n=picks.indexOf(x.it);x.badge.textContent=n>=0?n+1:""});
      if(picks.length===q.items.length){
        const ok=picks.every((x,k)=>x===q.items[k]);
        btns.forEach(x=>{const good=picks.indexOf(x.it)===q.items.indexOf(x.it);
          x.b.classList.add(good?"right":"wrong");
          x.b.insertAdjacentHTML("beforeend",good?'<span class="mark" aria-label="right place">✓</span>':'<span class="mark" aria-label="wrong place">✕</span>')});
        resolve(ok,false);
      }
    };
    box.appendChild(b);
  });
  P._showAnswer=()=>{
    btns.forEach(x=>{x.badge.textContent=q.items.indexOf(x.it)+1});
  };
}

function tick(){
  const left=Math.max(0,lim-(performance.now()-t0)/1000);
  $("bar").style.transform=`scaleX(${left/lim})`;
  if(left<=0){const q=deck[i];q.t==="scramble"||q.t==="order"?resolve(false,true):answer(null,null);return}
  raf=requestAnimationFrame(tick);
}

function answer(choice,btn){
  if(locked)return;
  const q=deck[i], ok=choice===q.a;
  $("panes").querySelectorAll(".pane").forEach(p=>{
    if(p.textContent===q.a){p.classList.add("right");p.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="correct">✓</span>')}
  });
  if(!ok&&btn){btn.classList.add("wrong");btn.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="your answer">✕</span>')}
  resolve(ok,choice===null);
}

function resolve(ok,timedOut){
  if(locked)return;locked=true;cancelAnimationFrame(raf);
  const q=deck[i], left=Math.max(0,lim-(performance.now()-t0)/1000);
  $("panes").classList.add("done");
  document.querySelectorAll("#panes button,#puzzle button").forEach(b=>b.disabled=true);
  if($("puzzle")._showAnswer){$("puzzle")._showAnswer(ok);$("puzzle")._showAnswer=null}
  let gained=0;
  if(ok){
    streak++;correct++;bestStreak=Math.max(bestStreak,streak);
    const base=q.t==="clues"?Math.round(PTS[q.d]*(1-.25*(clueN-1))):PTS[q.d];
    gained=base+Math.round(left/lim*100)+(streak>=2?streak*10:0);
    score+=gained;
  }else streak=0;
  const ans=q.t==="order"?q.items.join(" → "):q.a;
  $("score").textContent=score;
  $("streak").textContent=streak>=2?`🔥 ${streak}`:"";
  $("rh").textContent=ok?`Correct  +${gained}`:(timedOut?`Time's up. It was ${ans}.`:`Not quite. It was ${ans}.`);
  $("rn").textContent=q.n;$("rr").textContent=q.r;
  $("reveal").className="reveal on"+(ok?"":" miss");
  $("next").textContent=i===deck.length-1?"See results":"Next question";
  $("next").className="primary next on";$("next").focus({preventScroll:true});
}

$("next").onclick=()=>{i++;i<deck.length?ask():finish()};

function finish(){
  const best=getBest(), prev=best[level]||0, isNew=score>prev;
  if(isNew){best[level]=score;setBest(best)}
  $("final").textContent=score;
  $("bestEnd").textContent=isNew?(prev?`New best, up from ${prev}`:"Your first score on this level"):`Best on ${name(level)}: ${prev}`;
  $("sCorrect").textContent=`${correct}/${deck.length}`;
  $("sStreak").textContent=bestStreak;
  $("sLevel").textContent=name(level);
  const r=correct/deck.length;
  $("verdict").textContent=r===1?"A perfect round. Try the next level up.":r>=.7?"Strong round. A couple more and you'll have it all.":r>=.4?"Good start. Each miss comes with the verse, so the next round gets easier.":"Tough round. Read the references and run it back.";
  show("end");
}

$("go").onclick=start;
$("again").onclick=start;
$("home").onclick=()=>{paintBest();show("start")};
paintBest();
</script>
</body>
