<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEF5; --lead:#1D1B30; --text:#1D1B30; --muted:#5B5873; --surface:#FFFFFF;
  --lapis:#2E5AAC; --emerald:#1F8A70; --ruby:#B83B5E; --amber:#C98A10;
  --good:#1F8A70; --bad:#B83B5E; --line:rgba(29,27,48,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15142A; --lead:#07061A; --text:#F1EEFF; --muted:#A9A5C7; --surface:#201F3A;
    --lapis:#4A7BD6; --emerald:#2BAA8A; --ruby:#D5577A; --amber:#E4A92E;
    --good:#2BAA8A; --bad:#D5577A; --line:rgba(241,238,255,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#15142A; --lead:#07061A; --text:#F1EEFF; --muted:#A9A5C7; --surface:#201F3A;
  --lapis:#4A7BD6; --emerald:#2BAA8A; --ruby:#D5577A; --amber:#E4A92E;
  --good:#2BAA8A; --bad:#D5577A; --line:rgba(241,238,255,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:20px 18px 32px;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* Start */
.window{width:150px;height:190px;margin:28px auto 22px;border-radius:75px 75px 6px 6px;
  background:var(--lead);padding:7px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr;gap:7px;overflow:hidden}
.window span{display:block}
.window span:nth-child(1){background:var(--lapis);border-radius:68px 0 0 0}
.window span:nth-child(2){background:var(--ruby);border-radius:0 68px 0 0}
.window span:nth-child(3){background:var(--emerald)}
.window span:nth-child(4){background:var(--amber)}
h1{font-size:clamp(2.4rem,9vw,3.2rem);font-weight:800;line-height:1;margin:0 0 10px;text-align:center;letter-spacing:-.02em}
.lede{font-family:Newsreader,Georgia,serif;font-size:1.15rem;line-height:1.5;color:var(--muted);text-align:center;margin:0 auto 28px;max-width:34ch}
.label{font-weight:600;margin:0 0 10px;font-size:.95rem}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.lvl{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.lvl b{display:block;font-size:1.05rem}
.lvl small{color:var(--muted);font-size:.85rem}
.lvl[aria-pressed="true"]{border-color:var(--text)}
.primary{background:var(--text);color:var(--bg);border-radius:14px;padding:17px;font-weight:800;font-size:1.1rem;width:100%}
.best{text-align:center;color:var(--muted);margin-top:14px;font-size:.95rem;min-height:1.2em}

/* Game */
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;font-weight:600}
.hud .score{font-size:1.4rem;font-weight:800}
.hud .meta{color:var(--muted);font-size:.95rem}
.streak{color:var(--amber)}
.timer{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:22px}
.timer i{display:block;height:100%;width:100%;background:var(--text);transform-origin:left}
.kind{color:var(--muted);font-size:.9rem;font-weight:600;margin:0 0 8px}
.q{font-size:clamp(1.35rem,5.4vw,1.7rem);font-weight:600;line-height:1.25;margin:0 0 22px;letter-spacing:-.01em}
.q .quote{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400}

/* The leaded-glass answer panes */
.panes{display:grid;gap:8px;background:var(--lead);padding:8px;border-radius:18px}
.pane{color:#fff;text-align:left;padding:18px 16px;font-weight:600;font-size:1.05rem;line-height:1.3;border-radius:10px;
  position:relative;transition:filter .2s,opacity .2s,transform .12s;min-height:60px}
.pane::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.pane:nth-child(4n+1){background:var(--lapis)}
.pane:nth-child(4n+2){background:var(--ruby)}
.pane:nth-child(4n+3){background:var(--emerald)}
.pane:nth-child(4n+4){background:var(--amber);color:#1D1B30}
.pane:active{transform:scale(.98)}
.panes.done .pane{opacity:.28;cursor:default}
.panes.done .pane.right{opacity:1;box-shadow:0 0 0 3px #fff,0 0 22px 4px rgba(255,255,255,.45)}
.panes.done .pane.wrong{opacity:.7}
.pane .mark{float:right;font-weight:800;margin-left:8px}

.reveal{margin-top:18px;background:var(--surface);border-radius:14px;padding:16px 18px;border-left:5px solid var(--good);display:none}
.reveal.on{display:block}
.reveal.miss{border-left-color:var(--bad)}
.reveal h2{margin:0 0 6px;font-size:1.1rem}
.reveal p{margin:0;font-family:Newsreader,Georgia,serif;font-size:1.08rem;line-height:1.5}
.reveal .ref{font-family:inherit;color:var(--muted);font-size:.9rem;margin-top:8px}
.next{margin-top:16px;display:none}
.next.on{display:block}

/* Results */
.result-top{text-align:center;margin:36px 0 26px}
.big{font-size:clamp(3.5rem,16vw,5rem);font-weight:800;line-height:1;letter-spacing:-.03em}
.sub{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--lead);padding:8px;border-radius:18px;margin-bottom:22px}
.stats div{background:var(--surface);border-radius:10px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.stats small{color:var(--muted)}
.verdict{font-family:Newsreader,Georgia,serif;font-size:1.2rem;line-height:1.5;text-align:center;margin:0 auto 26px;max-width:32ch}
.ghost{background:transparent;color:var(--text);border:2px solid var(--line);border-radius:14px;padding:15px;font-weight:600;width:100%;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">

  <section class="screen on" id="start" aria-labelledby="t">
    <div class="window" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1 id="t">Bible Quiz</h1>
    <p class="lede">Ten questions. Twenty seconds each. Answer fast and keep your streak alive.</p>
    <p class="label">Choose a level</p>
    <div class="levels" role="group" aria-label="Level">
      <button class="lvl" data-l="mixed" aria-pressed="true"><b>Mixed</b><small>A bit of everything</small></button>
      <button class="lvl" data-l="easy" aria-pressed="false"><b>Easy</b><small>100 pts each</small></button>
      <button class="lvl" data-l="medium" aria-pressed="false"><b>Medium</b><small>150 pts each</small></button>
      <button class="lvl" data-l="hard" aria-pressed="false"><b>Hard</b><small>200 pts each</small></button>
    </div>
    <button class="primary" id="go">Start round</button>
    <p class="best" id="bestStart"></p>
  </section>

  <section class="screen" id="game" aria-live="polite">
    <div class="hud">
      <span class="score" id="score">0</span>
      <span class="meta"><span class="streak" id="streak"></span> <span id="count">1 of 10</span></span>
    </div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <p class="kind" id="kind"></p>
    <h2 class="q" id="q"></h2>
    <div class="panes" id="panes"></div>
    <div class="reveal" id="reveal"><h2 id="rh"></h2><p id="rn"></p><p class="ref" id="rr"></p></div>
    <button class="primary next" id="next">Next question</button>
  </section>

  <section class="screen" id="end">
    <div class="result-top">
      <div class="big" id="final">0</div>
      <div class="sub" id="bestEnd"></div>
    </div>
    <div class="stats">
      <div><b id="sCorrect">0</b><small>correct</small></div>
      <div><b id="sStreak">0</b><small>best streak</small></div>
      <div><b id="sLevel">Mixed</b><small>level</small></div>
    </div>
    <p class="verdict" id="verdict"></p>
    <button class="primary" id="again">Play again</button>
    <button class="ghost" id="home">Change level</button>
  </section>

</main>
<script>
const Q=[
// EASY
{d:"easy",k:"Multiple choice",q:"Who built the ark?",a:"Noah",w:["Moses","Abraham","David"],n:"God told Noah to build an ark of gopher wood before the flood.",r:"Genesis 6:14"},
{d:"easy",k:"Multiple choice",q:"How many disciples did Jesus choose as apostles?",a:"12",w:["7","10","40"],n:"Jesus appointed twelve to be with him and to preach.",r:"Mark 3:14"},
{d:"easy",k:"Multiple choice",q:"Who defeated Goliath?",a:"David",w:["Saul","Jonathan","Samson"],n:"David beat the Philistine giant with a sling and a stone.",r:"1 Samuel 17:50"},
{d:"easy",k:"Multiple choice",q:"In which town was Jesus born?",a:"Bethlehem",w:["Nazareth","Jerusalem","Capernaum"],n:"Jesus was born in Bethlehem of Judea in the days of Herod the king.",r:"Matthew 2:1"},
{d:"easy",k:"Multiple choice",q:"Who was swallowed by a great fish?",a:"Jonah",w:["Elijah","Peter","Job"],n:"Jonah was in the belly of the fish three days and three nights.",r:"Jonah 1:17"},
{d:"easy",k:"Multiple choice",q:"What is the first book of the Bible?",a:"Genesis",w:["Exodus","Matthew","Psalms"],n:"Genesis opens with the creation of the heavens and the earth.",r:"Genesis 1:1"},
{d:"easy",k:"Multiple choice",q:"On which day did God rest after creation?",a:"The seventh",w:["The first","The sixth","The eighth"],n:"God finished his work and rested on the seventh day.",r:"Genesis 2:2"},
{d:"easy",k:"Multiple choice",q:"Who led the Israelites out of Egypt?",a:"Moses",w:["Joshua","Aaron","Joseph"],n:"Moses led the people out, and they crossed the Red Sea on dry ground.",r:"Exodus 14"},
{d:"easy",k:"True or false",q:"Cain and Abel were the first two sons of Adam and Eve.",a:"True",w:["False"],n:"Eve bore Cain, and then his brother Abel.",r:"Genesis 4:1–2"},
{d:"easy",k:"Multiple choice",q:"Who betrayed Jesus for thirty pieces of silver?",a:"Judas Iscariot",w:["Peter","Thomas","Pontius Pilate"],n:"Judas agreed with the chief priests to hand Jesus over for thirty pieces of silver.",r:"Matthew 26:14–15"},
{d:"easy",k:"Finish the verse",q:"<span class='quote'>“The Lord is my shepherd; …”</span>",a:"I shall not want",w:["my cup runneth over","he restoreth my soul","I will fear no evil"],n:"The opening line of Psalm 23.",r:"Psalm 23:1 (KJV)"},
{d:"easy",k:"Multiple choice",q:"Who was thrown into the lions' den?",a:"Daniel",w:["Joseph","Jeremiah","Elisha"],n:"God shut the lions' mouths and Daniel came out unharmed.",r:"Daniel 6:16–22"},
{d:"easy",k:"Multiple choice",q:"What did Jesus turn water into at the wedding in Cana?",a:"Wine",w:["Oil","Milk","Bread"],n:"This was the first of Jesus' signs in John's Gospel.",r:"John 2:9–11"},
{d:"easy",k:"Multiple choice",q:"Which disciple denied Jesus three times?",a:"Peter",w:["John","Judas","Andrew"],n:"After the rooster crowed, Peter remembered Jesus' words and wept.",r:"Luke 22:61–62"},
{d:"easy",k:"Multiple choice",q:"What is the last book of the Bible?",a:"Revelation",w:["Jude","Malachi","Acts"],n:"Revelation closes both the New Testament and the Bible.",r:"Revelation 22"},
{d:"easy",k:"True or false",q:"Samson's strength was tied to his uncut hair.",a:"True",w:["False"],n:"Samson told Delilah that if his head were shaved, his strength would leave him.",r:"Judges 16:17"},
{d:"easy",k:"Multiple choice",q:"How many commandments did God give Moses on the tablets?",a:"Ten",w:["Seven","Twelve","Forty"],n:"Moses wrote on the tablets the words of the covenant, the ten commandments.",r:"Exodus 34:28"},
{d:"easy",k:"Who said it?",q:"<span class='quote'>“Here am I; send me.”</span>",a:"Isaiah",w:["Jeremiah","Moses","Samuel"],n:"Isaiah answered God's call in his vision of the temple.",r:"Isaiah 6:8"},
{d:"easy",k:"Multiple choice",q:"Who was Abraham's wife?",a:"Sarah",w:["Rachel","Rebekah","Leah"],n:"God changed her name from Sarai to Sarah.",r:"Genesis 17:15"},
{d:"easy",k:"Multiple choice",q:"Who climbed a sycamore tree to see Jesus?",a:"Zacchaeus",w:["Nicodemus","Bartimaeus","Lazarus"],n:"He was short, so he ran ahead and climbed the tree.",r:"Luke 19:3–4"},
{d:"easy",k:"Multiple choice",q:"Who was the first man God created?",a:"Adam",w:["Noah","Abel","Seth"],n:"God formed man of the dust of the ground and breathed life into him.",r:"Genesis 2:7, 20"},
{d:"easy",k:"Multiple choice",q:"Who was the mother of Jesus?",a:"Mary",w:["Martha","Elizabeth","Anna"],n:"The angel Gabriel told Mary she would bear a son and call him Jesus.",r:"Luke 1:30–31"},
{d:"easy",k:"Multiple choice",q:"What did God create on the first day?",a:"Light",w:["The sun","The animals","Man"],n:"God said, “Let there be light,” and there was light.",r:"Genesis 1:3–5"},
{d:"easy",k:"Multiple choice",q:"In which garden did Adam and Eve live?",a:"Eden",w:["Gethsemane","Sharon","Goshen"],n:"The Lord put the man in the garden of Eden to tend and keep it.",r:"Genesis 2:15"},
{d:"easy",k:"Multiple choice",q:"Which creature tempted Eve?",a:"The serpent",w:["A lion","A raven","A donkey"],n:"The serpent was more subtle than any beast of the field.",r:"Genesis 3:1"},
{d:"easy",k:"Multiple choice",q:"For how many days and nights did it rain in the flood?",a:"40",w:["7","12","100"],n:"The rain was upon the earth forty days and forty nights.",r:"Genesis 7:12"},
{d:"easy",k:"Multiple choice",q:"What sign did God give Noah after the flood?",a:"A rainbow",w:["A dove","A star","An olive tree"],n:"God set his bow in the cloud as a sign of his covenant.",r:"Genesis 9:13"},
{d:"easy",k:"Multiple choice",q:"Who was sold into slavery by his brothers?",a:"Joseph",w:["Benjamin","Isaac","Jacob"],n:"His brothers sold him for twenty pieces of silver.",r:"Genesis 37:28"},
{d:"easy",k:"Multiple choice",q:"Which baby was found in a basket among the reeds of the Nile?",a:"Moses",w:["Samuel","Joseph","Isaac"],n:"Pharaoh's daughter found him and raised him as her son.",r:"Exodus 2:3–10"},
{d:"easy",k:"Multiple choice",q:"In which river was Jesus baptized?",a:"The Jordan",w:["The Nile","The Euphrates","The Tigris"],n:"Jesus came from Nazareth and was baptized by John in the Jordan.",r:"Mark 1:9"},
{d:"easy",k:"Multiple choice",q:"Who baptized Jesus?",a:"John the Baptist",w:["Peter","Andrew","Elijah"],n:"John at first tried to stop him, saying he needed to be baptized by Jesus.",r:"Matthew 3:13–15"},
{d:"easy",k:"True or false",q:"Jesus walked on water.",a:"True",w:["False"],n:"In the fourth watch of the night Jesus came to his disciples, walking on the sea.",r:"Matthew 14:25"},
{d:"easy",k:"Multiple choice",q:"What was the job of Peter and Andrew when Jesus called them?",a:"Fishermen",w:["Carpenters","Shepherds","Tax collectors"],n:"“Follow me, and I will make you fishers of men.”",r:"Matthew 4:18–19"},
{d:"easy",k:"Multiple choice",q:"Whom did Jesus raise after four days in the tomb?",a:"Lazarus",w:["Jairus","Stephen","Zacchaeus"],n:"Jesus cried, “Lazarus, come forth,” and he came out.",r:"John 11:39–44"},
{d:"easy",k:"Finish the verse",q:"<span class='quote'>“For God so loved the world, that he gave …”</span>",a:"his only begotten Son",w:["his holy angels","his law to Moses","his kingdom to the poor"],n:"The best-known verse in the Gospel of John.",r:"John 3:16 (KJV)"},
{d:"easy",k:"Multiple choice",q:"In which garden did Jesus pray before his arrest?",a:"Gethsemane",w:["Eden","Sharon","Carmel"],n:"Jesus asked his disciples to sit while he went to pray.",r:"Matthew 26:36"},
{d:"easy",k:"True or false",q:"Jesus rose from the dead on the third day.",a:"True",w:["False"],n:"Paul lists it among the things of first importance.",r:"1 Corinthians 15:4"},
{d:"easy",k:"Multiple choice",q:"Which instrument did David play for King Saul?",a:"The harp",w:["The trumpet","The flute","The drum"],n:"When David played, Saul was refreshed.",r:"1 Samuel 16:23"},
{d:"easy",k:"Multiple choice",q:"Who was Mary's husband?",a:"Joseph",w:["Zechariah","Simeon","Joachim"],n:"Joseph, the husband of Mary, of whom was born Jesus.",r:"Matthew 1:16"},
{d:"easy",k:"True or false",q:"The book of Jonah is in the New Testament.",a:"False",w:["True"],n:"Jonah is one of the minor prophets in the Old Testament.",r:"Jonah"},
// MEDIUM
{d:"medium",k:"Multiple choice",q:"Who was the first king of Israel?",a:"Saul",w:["David","Solomon","Samuel"],n:"Samuel anointed Saul as Israel's first king.",r:"1 Samuel 10:1"},
{d:"medium",k:"Multiple choice",q:"Which disciple was a tax collector?",a:"Matthew",w:["Thomas","Philip","James"],n:"Jesus saw Matthew sitting at the tax booth and called him.",r:"Matthew 9:9"},
{d:"medium",k:"Multiple choice",q:"What was the name of Moses' brother?",a:"Aaron",w:["Caleb","Joshua","Levi"],n:"God sent Aaron to speak for Moses.",r:"Exodus 4:14"},
{d:"medium",k:"Multiple choice",q:"Who interpreted Pharaoh's dreams about cows and grain?",a:"Joseph",w:["Daniel","Moses","Jacob"],n:"Joseph predicted seven years of plenty followed by seven of famine.",r:"Genesis 41"},
{d:"medium",k:"Multiple choice",q:"How many books are in the New Testament?",a:"27",w:["24","39","66"],n:"The New Testament has 27 books; the whole Protestant Bible has 66.",r:"Matthew to Revelation"},
{d:"medium",k:"Multiple choice",q:"Whose walls fell after Israel marched around it?",a:"Jericho",w:["Ai","Jerusalem","Babylon"],n:"The people shouted, the trumpets blew, and the wall fell down flat.",r:"Joshua 6:20"},
{d:"medium",k:"Multiple choice",q:"What was Paul's name before it was changed?",a:"Saul",w:["Simon","Silas","Stephen"],n:"Acts introduces him as Saul, who also is called Paul.",r:"Acts 13:9"},
{d:"medium",k:"Multiple choice",q:"Who became Isaac's wife?",a:"Rebekah",w:["Rachel","Leah","Hagar"],n:"Isaac brought Rebekah into his mother Sarah's tent and loved her.",r:"Genesis 24:67"},
{d:"medium",k:"Which came first?",q:"Which of these happened first?",a:"The flood",w:["The Tower of Babel","The call of Abraham","The Exodus"],n:"The flood comes in Genesis 7, before Babel (ch. 11) and Abraham's call (ch. 12).",r:"Genesis 7–12"},

{d:"medium",k:"Multiple choice",q:"On which mountain did Moses receive the Law?",a:"Mount Sinai",w:["Mount Carmel","Mount Zion","Mount of Olives"],n:"The Lord came down on Mount Sinai and called Moses to the top.",r:"Exodus 19:20"},
{d:"medium",k:"Multiple choice",q:"Which prophet faced the prophets of Baal on Mount Carmel?",a:"Elijah",w:["Elisha","Jonah","Amos"],n:"Fire fell from heaven and consumed Elijah's sacrifice.",r:"1 Kings 18:38"},
{d:"medium",k:"True or false",q:"The book of Esther never names God directly.",a:"True",w:["False"],n:"God's name does not appear in the Hebrew text of Esther, though his care runs through the story.",r:"Esther"},
{d:"medium",k:"Multiple choice",q:"How many loaves fed the five thousand?",a:"Five",w:["Two","Seven","Twelve"],n:"Five loaves and two fish, with twelve baskets left over.",r:"Matthew 14:17–20"},
{d:"medium",k:"Finish the verse",q:"<span class='quote'>“In the beginning was the Word, and the Word was with God, and …”</span>",a:"the Word was God",w:["the Word was light","the Word became flesh","the Word was life"],n:"The opening of John's Gospel.",r:"John 1:1 (KJV)"},
{d:"medium",k:"Multiple choice",q:"Who was the mother of John the Baptist?",a:"Elizabeth",w:["Mary","Anna","Martha"],n:"Elizabeth was a relative of Mary.",r:"Luke 1:36, 57"},

{d:"medium",k:"Multiple choice",q:"Which of Abraham's relatives settled near Sodom?",a:"Lot, his nephew",w:["Laban, his cousin","Nahor, his brother","Ishmael, his son"],n:"Lot pitched his tent toward Sodom.",r:"Genesis 13:12"},
{d:"medium",k:"Multiple choice",q:"Who was Jacob's twin brother?",a:"Esau",w:["Laban","Ishmael","Reuben"],n:"Jacob was born holding Esau's heel.",r:"Genesis 25:25–26"},
{d:"medium",k:"Multiple choice",q:"How many sons did Jacob have?",a:"12",w:["10","7","13"],n:"Their families became the twelve tribes of Israel.",r:"Genesis 35:22"},
{d:"medium",k:"Multiple choice",q:"Who hid the two spies in Jericho?",a:"Rahab",w:["Deborah","Jael","Miriam"],n:"She hid them under stalks of flax on her roof.",r:"Joshua 2:1–6"},
{d:"medium",k:"Multiple choice",q:"Which prophetess judged Israel under a palm tree?",a:"Deborah",w:["Miriam","Huldah","Jael"],n:"The people came up to her for judgment.",r:"Judges 4:4–5"},
{d:"medium",k:"Multiple choice",q:"Who led Israel after Moses died?",a:"Joshua",w:["Caleb","Aaron","Eleazar"],n:"God told Joshua to lead the people over the Jordan.",r:"Joshua 1:1–2"},

{d:"medium",k:"Multiple choice",q:"Which prophet was taken up to heaven in a whirlwind?",a:"Elijah",w:["Elisha","Isaiah","Moses"],n:"A chariot of fire parted Elijah and Elisha.",r:"2 Kings 2:11"},
{d:"medium",k:"Multiple choice",q:"Which queen risked her life to save the Jews in Persia?",a:"Esther",w:["Vashti","Jezebel","Bathsheba"],n:"“If I perish, I perish.”",r:"Esther 4:16"},

const PTS={easy:100,medium:150,hard:200}, ROUND=10, TIME=20;
let level="mixed", deck=[], i=0, score=0, streak=0, bestStreak=0, correct=0, t0=0, raf=0, locked=false;
const $=id=>document.getElementById(id);

function getBest(){try{return JSON.parse(localStorage.getItem("bq-best")||"{}")}catch(e){return{}}}
function setBest(o){try{localStorage.setItem("bq-best",JSON.stringify(o))}catch(e){}}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
function name(l){return l[0].toUpperCase()+l.slice(1)}
function paintBest(){const b=getBest()[level];$("bestStart").textContent=b?`Your best on ${name(level)}: ${b}`:""}

document.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{
  level=b.dataset.l;
  document.querySelectorAll(".lvl").forEach(x=>x.setAttribute("aria-pressed",x===b));
  paintBest();
});

function start(){
  const pool=level==="mixed"?Q:Q.filter(q=>q.d===level);
  deck=shuffle(pool).slice(0,ROUND);
  i=0;score=0;streak=0;bestStreak=0;correct=0;
  show("game");ask();
}

function ask(){
  locked=false;
  const q=deck[i];
  $("score").textContent=score;
  $("count").textContent=`${i+1} of ${deck.length}`;
  $("streak").textContent=streak>=2?`🔥 ${streak}`:"";
  $("kind").textContent=`${q.k} · ${name(q.d)}`;
  $("q").innerHTML=q.q;
  const opts=q.k==="True or false"?["True","False"]:shuffle([q.a,...q.w]);
  const box=$("panes");box.className="panes";box.innerHTML="";
  box.style.gridTemplateColumns=opts.length===2?"1fr 1fr":"1fr";
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="pane";b.textContent=o;
    b.onclick=()=>answer(o,b);
    box.appendChild(b);
  });
  $("reveal").className="reveal";$("next").className="primary next";
  t0=performance.now();cancelAnimationFrame(raf);tick();
}

function tick(){
  const left=Math.max(0,TIME-(performance.now()-t0)/1000);
  $("bar").style.transform=`scaleX(${left/TIME})`;
  if(left<=0){answer(null,null);return}
  raf=requestAnimationFrame(tick);
}

function answer(choice,btn){
  if(locked)return;locked=true;cancelAnimationFrame(raf);
  const q=deck[i], ok=choice===q.a;
  const left=Math.max(0,TIME-(performance.now()-t0)/1000);
  $("panes").classList.add("done");
  $("panes").querySelectorAll(".pane").forEach(p=>{
    p.disabled=true;
    if(p.textContent===q.a){p.classList.add("right");p.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="correct">✓</span>')}
  });
  let gained=0;
  if(ok){
    streak++;correct++;bestStreak=Math.max(bestStreak,streak);
    gained=PTS[q.d]+Math.round(left*5)+(streak>=2?streak*10:0);
    score+=gained;
  }else{
    streak=0;
    if(btn){btn.classList.add("wrong");btn.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="your answer">✕</span>')}
  }
  $("score").textContent=score;
  $("streak").textContent=streak>=2?`🔥 ${streak}`:"";
  $("rh").textContent=ok?`Correct  +${gained}`:(choice===null?`Time's up. It was ${q.a}.`:`Not quite. It was ${q.a}.`);
  $("rn").textContent=q.n;$("rr").textContent=q.r;
  $("reveal").className="reveal on"+(ok?"":" miss");
  $("next").textContent=i===deck.length-1?"See results":"Next question";
  $("next").className="primary next on";$("next").focus({preventScroll:true});
}

$("next").onclick=()=>{i++;i<deck.length?ask():finish()};

function finish(){
  const best=getBest(), prev=best[level]||0, isNew=score>prev;
  if(isNew){best[level]=score;setBest(best)}
  $("final").textContent=score;
  $("bestEnd").textContent=isNew?(prev?`New best, up from ${prev}`:"Your first score on this level"):`Best on ${name(level)}: ${prev}`;
  $("sCorrect").textContent=`${correct}/${deck.length}`;
  $("sStreak").textContent=bestStreak;
  $("sLevel").textContent=name(level);
  const r=correct/deck.length;
  $("verdict").textContent=r===1?"A perfect round. Try the next level up.":r>=.7?"Strong round. A couple more and you'll have it all.":r>=.4?"Good start. Each miss comes with the verse, so the next round gets easier.":"Tough round. Read the references and run it back.";
  show("end");
}

$("go").onclick=start;
$("again").onclick=start;
$("home").onclick=()=>{paintBest();show("start")};
paintBest();
</script>
